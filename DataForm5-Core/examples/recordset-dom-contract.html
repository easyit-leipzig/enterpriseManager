<!--
DataForm 5 – empfohlener DOM-Vertrag

Wichtig:
1. Datensätze liegen in recordset-data.
2. Die New-Record-Zeile trägt data-record-state="new".
3. Das Parent-FK-Feld heißt real to_ev_id.
4. Die Paginierung ist ein eigener Geschwisterblock NACH den Daten.
-->
<section
    class="df-recordset"
    data-role="recordset"
    data-recordset-id="rs_ed_ev_info"
>
    <div
        class="df-recordset-scroll"
        data-role="recordset-data"
    >
        <!-- bestehende Datensätze -->

        <div
            class="df-record-new"
            data-record-state="new"
        >
            <select
                name="to_ev_id"
                data-field="to_ev_id"
            >
                <!--
                DataFormBoundBinding ersetzt die Placeholder-Anzeige
                unmittelbar durch:
                    <option value="9201" selected>#9201</option>
                -->
                <option value="">
                    Eltern-Datensatz wählen
                </option>
            </select>
        </div>
    </div>

    <!-- IMMER außerhalb des Scrollcontainers -->
    <nav
        class="df-recordset-pagination"
        data-role="recordset-pagination"
        aria-label="Datensatzseiten"
    >
        ...
    </nav>
</section>
